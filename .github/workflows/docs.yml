name: Docs

# Publishes the documentation (docs/, a KD Help Book docset) to GitHub Pages:
# builds the khb CLI and the viewer from KDHelpBook/monorepo sources, compiles
# docs/ to a .khb, packs the distribution (bundled profile + llms.txt export)
# and deploys it with the official Pages actions.
#
# When called from release.yml (release-tag set) it builds from the tagged
# commit and additionally uploads a version-suffixed nfc-to-rfid-vX.Y.Z.khb
# as a release asset — the suffixed docset id lets an archived book coexist
# with the current one when loaded together in a viewer.
#
# Requires: repo Settings → Pages → Source set to "GitHub Actions".
#
# The CLI/viewer are built from the monorepo's main branch — the project has
# no releases yet. Once it publishes one, pin `ref` below to that tag.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: "Existing GitHub release tag to upload the .khb to (e.g. v1.2.3)"
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When called from the Release workflow, build exactly the tagged commit.
          ref: ${{ inputs.release-tag || github.ref }}

      - name: Checkout KDHelpBook/monorepo
        uses: actions/checkout@v4
        with:
          repository: KDHelpBook/monorepo
          ref: main
          path: khb-src

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: khb-src/compiler

      - name: Build the khb CLI
        run: cargo build --release -p khb-cli
        working-directory: khb-src/compiler

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: khb-src/viewer-ts/package-lock.json

      - name: Build the viewer
        run: |
          npm ci
          npm run build
        working-directory: khb-src/viewer-ts

      # The docset is versioned together with the app (workspace-only sed,
      # never committed): the version comes from gradle.properties, so the
      # published book always matches the app version of the built commit.
      - name: Compile the docset
        run: |
          BIN=khb-src/compiler/target/release/khb
          VER=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          sed -i "s/^version = \".*\"$/version = \"${VER}\"/" docs/docset.toml
          grep -q "^version = \"${VER}\"$" docs/docset.toml
          mkdir -p out
          "$BIN" compile docs -o out/nfc-to-rfid.khb

          # Release build: also compile the archive copy with a
          # version-suffixed docset id and upload it as a release asset.
          TAG="${{ inputs.release-tag }}"
          if [[ -n "$TAG" ]]; then
            [[ "v$VER" == "$TAG" ]] \
              || { echo "::error::gradle.properties version ($VER) does not match tag ($TAG)"; exit 1; }
            sed -i "s/^id = \"nfc-to-rfid\"$/id = \"nfc-to-rfid-v${VER}\"/" docs/docset.toml
            grep -q "^id = \"nfc-to-rfid-v${VER}\"$" docs/docset.toml
            "$BIN" compile docs -o "out/nfc-to-rfid-v${VER}.khb"
          fi

      - name: Upload docset artifact
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-khb
          path: out/nfc-to-rfid-v*.khb
          if-no-files-found: error

      # The bundled profile locks the dist (the site serves exactly this book)
      # and keeps the PWA off, so every deploy is picked up immediately.
      # --home lands cold starts on the docs overview instead of Search;
      # --llms also emits llms.txt / llms-full.txt / per-page md for AI use.
      - name: Pack the distribution
        run: |
          khb-src/compiler/target/release/khb pack --profile bundled \
            --viewer khb-src/viewer-ts/dist \
            --docset out/nfc-to-rfid.khb \
            --home nfc-to-rfid:index \
            --llms \
            -o publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  release-asset:
    name: Upload release asset
    if: inputs.release-tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-khb
          path: assets
      - name: Publish .khb to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" assets/*.khb --clobber -R "${{ github.repository }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
